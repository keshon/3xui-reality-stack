server {
    listen 80 default_server;
    root /usr/share/nginx/html;
    index index.html;

    # Look like an ordinary static host. No server tokens, no directory listing.
    server_tokens off;
    autoindex off;

    location / {
        try_files $uri $uri/ =404;
    }

    # A real site has a favicon and a robots.txt. Absence of both is a smell.
    location = /robots.txt { access_log off; }
    location = /favicon.ico { access_log off; log_not_found off; }
}
